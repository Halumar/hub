# Brand lint for halumar/hub (merged onto contracts/tools/brand/default.brandlint.toml).
# Namespace literals live in halumar/rootfs/opt/hub/namespace.py; tests pin the frozen
# namespace as literals on purpose.
# The issue template links name the product, its website and the repositories.
namespace_allowed = [
  "halumar/tests/**",
  "frontend/e2e/**",
  "repository.yaml",
  # Image labels.
  "halumar/Dockerfile",
  # AppArmor: the profile name is the slug (the Supervisor renames it).
  "halumar/apparmor.txt",
  # Legal texts: repository and image paths (NOTICE, its image copy, the notice generator).
  "**/NOTICE",
  "scripts/third_party_notices.py",
  ".github/ISSUE_TEMPLATE/config.yml",
  # Workflows name the add-on folder (= the slug) in paths and build contexts.
  "**/workflows/*",
]
# Image labels name the app.
# Legal texts name the licensor's product (NOTICE, its image copy, the notice generator).
# The contract checkout names the organization's contract repository.
brand_allowed = ["halumar/Dockerfile", "**/NOTICE", "scripts/third_party_notices.py", ".github/ISSUE_TEMPLATE/config.yml", "**/actions/contracts/action.yml"]
# Build output of the admin UI (frontend/, regenerated by `npm run build`).
# The web manifest is generated from brand.ts by the build (src/routes/manifest.webmanifest).
exclude = ["halumar/rootfs/opt/hub/static/*.html", "halumar/rootfs/opt/hub/static/*.webmanifest"]
# The app folder equals the slug (Home Assistant store convention).
allow_line_patterns = ['halumar/(rootfs|tests|config\.yaml|Dockerfile|CHANGELOG\.md|requirements)']
