name: Frontend CI

# Admin UI gate: audit, svelte-check, build, Playwright. Runs on pull requests
# and on develop; on main build.yaml calls it before every release.

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-frontend-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Audit, check, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies end up in the shipped bundle (static/), so a known
      # vulnerability fails the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: svelte-check
        run: npm run check -- --fail-on-warnings

      # Same output as `npm run build`, and it records which npm packages end up in
      # the browser bundle (node_modules/.cache/third-party/bundle-packages.json).
      - name: Build
        run: npm run licenses

      # Blocking: svelte, @sveltejs/kit and qrcode are devDependencies, so the audit
      # above never sees them, yet they run in the browser. Exceptions with reason in
      # .github/npm-audit-bundle-allow.txt.
      - name: Audit bundled packages
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node ../scripts/ci/npm-audit-bundle.mjs "$RUNNER_TEMP/npm-audit.json" \
            node_modules/.cache/third-party/bundle-packages.json ../.github/npm-audit-bundle-allow.txt

      # The checked-in bundle (halumar/rootfs/opt/hub/static) is not byte-reproducible
      # (SvelteKit build timestamp), so a strict diff would always fail. It never
      # reaches an image: releases (build.yaml, job `bundle`) and the image check
      # (ci.yml, job `image`) build the bundle from src/. Informational only.
      - name: Bundle drift (informational)
        working-directory: .
        run: |
          changed="$(git status --porcelain -- halumar/rootfs/opt/hub/static | wc -l | tr -d ' ')"
          {
            echo "### Admin UI bundle"
            echo "Files that differ from the checked-in static/ after npm run build: ${changed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
